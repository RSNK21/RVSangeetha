name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["main", "init", "hoplite/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/py/rvsangeetha/dsp
          cp rvsangeetha/web/static/index.html _site/
          cp rvsangeetha/web/static/engine.js _site/
          cp rvsangeetha/web/local_session.py _site/py/
          cp rvsangeetha/__init__.py _site/py/rvsangeetha/
          cp rvsangeetha/dsp/*.py _site/py/rvsangeetha/dsp/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
